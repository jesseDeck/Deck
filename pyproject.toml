[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deck-broker-agents"
version = "0.1.0"
description = "Deck agent scaffolding for London broker management systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.0",
]

[project.scripts]
deck-broker-agents = "deck_broker_agents.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
